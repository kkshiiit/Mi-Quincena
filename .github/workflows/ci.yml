name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Tests
        run: npm test
      - name: Prueba de interfaz
        run: |
          npm i --no-save playwright@1.65.1
          npx playwright install --with-deps chromium
          npm run test:ui
          npm run test:contrast
      - name: Herramientas de compilación
        run: |
          mkdir -p ~/tools
          curl -fsSL -o ~/tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          curl -fsSL -o ~/tools/signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
      - name: Compilar APK (clave de prueba)
        run: APKTOOL_JAR=$HOME/tools/apktool.jar SIGNER_JAR=$HOME/tools/signer.jar bash scripts/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Mi-Quincena-apk
          path: dist/Mi-Quincena.apk
          retention-days: 14
