name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ¿Versión nueva?
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "new=0" >> "$GITHUB_OUTPUT"; else echo "new=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v7
        if: steps.ver.outputs.new == '1'
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        if: steps.ver.outputs.new == '1'
        with:
          distribution: temurin
          java-version: 17
      - name: Herramientas
        if: steps.ver.outputs.new == '1'
        run: |
          mkdir -p ~/tools
          curl -fsSL -o ~/tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          curl -fsSL -o ~/tools/signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
      - name: Clave de firma (si está configurada)
        if: steps.ver.outputs.new == '1'
        env:
          KS: ${{ secrets.MQ_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "MQ_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; echo "SIGNED=1" >> "$GITHUB_ENV"; fi
      - name: Compilar
        if: steps.ver.outputs.new == '1'
        env:
          MQ_KEY_ALIAS: ${{ secrets.MQ_KEY_ALIAS }}
          MQ_KEY_PASS: ${{ secrets.MQ_KEY_PASS }}
          MQ_STORE_PASS: ${{ secrets.MQ_STORE_PASS }}
        run: APKTOOL_JAR=$HOME/tools/apktool.jar SIGNER_JAR=$HOME/tools/signer.jar bash scripts/build.sh
      - name: Notas
        if: steps.ver.outputs.new == '1'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0=="## "v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          if [ -z "$SIGNED" ]; then printf '\n> [!WARNING]\n> APK firmado con clave de prueba. Si ya tenés la app instalada, exportá una copia antes: Android puede pedir desinstalar.\n' >> notes.md; fi
      - uses: softprops/action-gh-release@v3
        if: steps.ver.outputs.new == '1'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: Mi Quincena ${{ steps.ver.outputs.tag }}
          body_path: notes.md
          files: dist/Mi-Quincena.apk
